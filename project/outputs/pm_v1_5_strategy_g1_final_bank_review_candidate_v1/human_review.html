content": "Aw so you are so exhausted from racing thoughts and not enough sleep the night before that you end up taking it out on others, but not meaning to. Am I understanding correctly?", "speaker": "supporter"}, {"content": "Do you get any exercise? I sleep better on days I go for walks, and my sedentary days I sleep worse, it's quite clear to me.", "speaker": "supporter"}, {"content": "I have been trying to do lots of walks, I need to lose weight as well so they kind of go hand in hand!", "speaker": "seeker"}, {"content": "I do also have back pain so that's another thing that doesn't help!", "speaker": "seeker"}], "supporter_response_to_label": "Good effort, keep it up!"}, {"blind_item_id": "strategy_g1_d95bb58e7f9fb237d763", "source_dialogue_id": "esconv_0842", "source_turn_index": 66, "recent_visible_dialogue": [{"content": "yup. Exactly. Lost time can always be made up later.", "speaker": "seeker"}, {"content": "okay then. I am good to go. Thanks again and thank you for your input. It does help to just kind of vent in a way.", "speaker": "seeker"}, {"content": "Before we quit, would you want to say one specific thing you know you can do today to help yourself out?", "speaker": "supporter"}, {"content": "Yeah for sure", "speaker": "seeker"}, {"content": "I worked out a little bit before I started the chat. I am also doing some online courses on my own time. So I will keep working hard on those. And I hope to get back more into the routine of working out. I really do think it helps my mood if I just make more time and motivation for that.", "speaker": "seeker"}, {"content": "And you seem intelligent and analytical also and you know what I mean. So I do appreciate your time and input", "speaker": "seeker"}], "supporter_response_to_label": "Nice! Good job with those things."}]}, {"protocol": "pm-v1.5-strategy-g1-final-bank-human-review-v1", "card_id": "strategy_g1_db12f27016c7060060b4", "move_id": "AM10_offer_one_optional_micro_step", "name": "Offer one optional micro-step", "support_move": "Offer one concrete, low-risk, low-burden next step tied to the user's stated goal and make it easy to decline.", "when_to_use": "Use when advice or action help is explicitly welcomed, the goal is clear, and one low-risk, low-burden step fits that goal.", "when_not_to_use": "Do not use under a listen-only boundary, stack multiple tasks, prescribe a high-stakes action, or present the step as mandatory or guaranteed to work.", "compatible_support_modes": ["light_guidance"], "compatible_dialogue_phases": ["action"], "goal_types": ["take_one_step"], "directive_burden": "light", "risk_flags": ["unsolicited_advice", "excessive_directiveness", "domain_claim"], "source_gate_status": "STANDARD_20_DIALOGUE_GATE_PASS", "exception_rationale": "", "clean_weak_source_dialogues": 25, "problem_type_count_audit_only": 6, "emotion_type_count_audit_only": 5, "maximum_single_problem_type_share_audit_only": 0.3077, "eligible_for_g2": false, "raw_source_responses_exposed_to_generator": false, "source_examples": [{"blind_item_id": "strategy_g1_fcc33d1068cc4182bdde", "source_dialogue_id": "esconv_0970", "source_turn_index": 25, "recent_visible_dialogue": [{"content": "What gave you the strength to go forward?", "speaker": "seeker"}, {"content": "I have this nervousness about getting rejected.", "speaker": "seeker"}, {"content": "Doing little things every day", "speaker": "supporter"}, {"content": "So, keep myself busy and try to ignore my nervousness?", "speaker": "seeker"}, {"content": "Really adds up and helps to get the big picture moving.", "speaker": "supporter"}, {"content": "OK, so with, well, kinf0f like baby steps....right", "speaker": "seeker"}], "supporter_response_to_label": "It is about making small adjustments to feed a good habit."}, {"blind_item_id": "strategy_g1_6d411af2f2f1217a1005", "source_dialogue_id": "esconv_1097", "source_turn_index": 15, "recent_visible_dialogue": [{"content": "I was in a job that I felt was a waste of time and I was able to find another one eventually. I understand how you can feel. Do you have any plans to look for different work in the future?", "speaker": "supporter"}, {"content": "No. I have no energy to find a new job. Also given the pandemic, keeping a secure paying job is more important than happiness.", "speaker": "seeker"}, {"content": "I can relate to that feeling too. You are exhausted and feeling like you cant get out of a rut sort of?", "speaker": "supporter"}, {"content": "Yes you hit the nail on the head. In a rut for sure.", "speaker": "seeker"}, {"content": "I am glad that you are expressing yourslef today and facing your feelings. This could be a start to changing somethings in your life. It isn't usually easy talking about being in a rut.", "speaker": "supporter"}, {"content": "It is very tough to express feelings.", "speaker": "seeker"}], "supporter_response_to_label": "I would like to suggest starting a journal to write down just the bullet points of how you feel at the end of each day. Would you consider trying this activity?"}, {"blind_item_id": "strategy_g1_1c2b638f3b7209d423b0", "source_dialogue_id": "esconv_0254", "source_turn_index": 31, "recent_visible_dialogue": [{"content": "maybe you try to talk to her again today", "speaker": "supporter"}, {"content": "i am planning on it", "speaker": "seeker"}, {"content": "if that does not work then maybe it will be best to just focus on yourself i know how hard that can be but sometimes its for the best", "speaker": "supporter"}, {"content": "that will be hard because i am soo used to her being around", "speaker": "seeker"}, {"content": "I can understand that but the only way you can work it out with her if both of you two just talk", "speaker": "supporter"}, {"content": "yes you are right", "speaker": "seeker"}], "supporter_response_to_label": "I suggest you try to talk to her today and let her know how you are feeling"}, {"blind_item_id": "strategy_g1_283e7f5e1fb1c6dc1ce2", "source_dialogue_id": "esconv_1253", "source_turn_index": 21, "recent_visible_dialogue": [{"content": "You can do a great deal better, I am sure!", "speaker": "supporter"}, {"content": "Thanks. You are right, I am too good for him. I had a job and he doesn’t.", "speaker": "seeker"}, {"content": "Well quite! You can easily move forward with your life. He will not find it so easy. But do get the dog back.", "speaker": "supporter"}, {"content": "Yeah, I need the dog. He gave it to me as a puppy for my birthday. I can’t believe he took it.", "speaker": "seeker"}, {"content": "Do you know that there are legal organisations out there that will help you get it back?", "speaker": "supporter"}, {"content": "But I am still having a hard time getting to sleep, I am so upset. I have been crying for hours.", "speaker": "seeker"}], "supporter_response_to_label": "I suggest you have a nice warm bath and a cup of cocoa and try to relax"}, {"blind_item_id": "strategy_g1_0cb65bb67365721e4440", "source_dialogue_id": "esconv_0325", "source_turn_index": 12, "recent_visible_dialogue": [{"content": "Sometimes just having someone to talk to who knows how you are feeling can be really helpful I think.", "speaker": "supporter"}, {"content": "It's sad that this year has been so awful. It's hard to convince myself that it's getting better any time soon..", "speaker": "seeker"}, {"content": "Can you make a list of all the things that you hope will be better next year so you can tick them off one by one?", "speaker": "supporter"}, {"content": "1. Better job 2. Healthier habits 3. Better financial situation", "speaker": "seeker"}, {"content": "Well, the first and third one are out of your control really but you could make a start on the first one today if you liked :)", "speaker": "supporter"}, {"content": "It's hard to take the first steps. I don't even know where to begin, sadly.", "speaker": "seeker"}], "supporter_response_to_label": "I can understand that. Perhaps you could join an exercise class or similar?"}]}, {"protocol": "pm-v1.5-strategy-g1-final-bank-human-review-v1", "card_id": "strategy_g1_bc59d3da5bb6679a7c84", "move_id": "AM14_supportive_transition", "name": "Offer a bounded conversational transition", "support_move": "Offer to continue, change focus, or close the current exchange while avoiding promises of permanent availability.", "when_to_use": "Use when the user signals fatigue, completion, a wish to change focus, or a need to choose whether to continue or close.", "when_not_to_use": "Do not close abruptly while the user is still engaging, ignore an active high-stakes cue, or promise permanent availability.", "compatible_support_modes": ["listen", "comfort_reassure", "explore"], "compatible_dialogue_phases": ["transition", "closing"], "goal_types": ["respect_boundary", "reduce_burden"], "directive_burden": "none", "risk_flags": ["premature_closure", "availability_overclaim", "unhandled_high_stakes_cue"], "source_gate_status": "STANDARD_20_DIALOGUE_GATE_PASS", "exception_rationale": "", "clean_weak_source_dialogues": 21, "problem_type_count_audit_only": 5, "emotion_type_count_audit_only": 6, "maximum_single_problem_type_share_audit_only": 0.2857, "eligible_for_g2": false, "raw_source_responses_exposed_to_generator": false, "source_examples": [{"blind_item_id": "strategy_g1_1e982abb6d288e84fa04", "source_dialogue_id": "esconv_0263", "source_turn_index": 18, "recent_visible_dialogue": [{"content": "From what I've seen before, surrounding yourself with good friends helps quite a bit.", "speaker": "supporter"}, {"content": "Thank you very much. But i can't accept this pain.", "speaker": "seeker"}, {"content": "I understand feeling that way. Something I do when I am feeling pain is taking deep breaths. Inhale, exhale. Could you do that for me?", "speaker": "supporter"}, {"content": "I am sorry. I can't chat any more please end of this survey.", "speaker": "seeker"}, {"content": "Ok. I can try.", "speaker": "seeker"}, {"content": "I am sorry to hear that. I believe in you, things will be better with time.", "speaker": "supporter"}], "supporter_response_to_label": "Would you like to continue chatting?"}, {"blind_item_id": "strategy_g1_8e0e1743c5d53c5f8d9e", "source_dialogue_id": "esconv_1058", "source_turn_index": 27, "recent_visible_dialogue": [{"content": "oh I see, yes that could be awkward for sure.", "speaker": "supporter"}, {"content": "i think it's important you go out with your friend, but can understand your reluctance to run into your ex. Could you go out for coffee or lunch instead?", "speaker": "supporter"}, {"content": "Well that's would be quite strange as we usually meet only for drinks.", "speaker": "seeker"}, {"content": "Ah gotcha. So do you think you will accept or not? Or still need time to think about it?", "speaker": "supporter"}, {"content": "I will give it a go and see what happens. I will text you tomorrow to let you know how it went", "speaker": "seeker"}, {"content": "i hope if you go that you have an enjoyable time, and that your friend respects your boundaries. And worse case scenario, if your ex is there, you could leave early...if it were me I'd warn my friend that I might have to", "speaker": "supporter"}], "supporter_response_to_label": "I'm glad you are going! Take care of yourself and have a good time. Was there anything else?"}, {"blind_item_id": "strategy_g1_0f5794de341a5c18857a", "source_dialogue_id": "esconv_0542", "source_turn_index": 17, "recent_visible_dialogue": [{"content": "I'll try! Thank you so much for the advice!", "speaker": "seeker"}, {"content": "Also, there are many online resources that are great at finding available jobs and require your time and effort, but not any money invested. This might be a good tool as well!", "speaker": "supporter"}, {"content": "That's very true. Maybe I'll get started on that tonight.", "speaker": "seeker"}, {"content": "I hope so. I've also been in a similar situation so I can completely understand your feelings.", "speaker": "supporter"}, {"content": "Keep in mind there are also resume sites that are free to use, as I know you are concerned about the financial part in that area.", "speaker": "supporter"}, {"content": "That's nice to hear! Sometimes it feels like I'm being dramatic. I really appreciate your thoughts, having an action plan really helps me feel less anxious. Thank you.", "speaker": "seeker"}], "supporter_response_to_label": "Can I help with anything else?"}, {"blind_item_id": "strategy_g1_6b0c88f46bf30fc55009", "source_dialogue_id": "esconv_0615", "source_turn_index": 24, "recent_visible_dialogue": [{"content": "From what I've seen having confidence in yourself and what you feel in your heart won't lie.", "speaker": "supporter"}, {"content": "do you think it's good if they find out about each other? sometimes guys try harder when they know there is competition. sometimes it makes them run the other way", "speaker": "seeker"}, {"content": "Do you think one may have jealousy and get aggressive if he finds out? It's a personal decision that takes some thought.", "speaker": "supporter"}, {"content": "honestly im not sure. there is always that risk when doing that with guys. i better think long and hard before doing that!", "speaker": "seeker"}, {"content": "It sounds like you put a lot of thought into things which can be helpful in decision making.", "speaker": "supporter"}, {"content": "i think so. keeps me out of some potential messes", "speaker": "seeker"}], "supporter_response_to_label": "Can I help you with anything else?"}, {"blind_item_id": "strategy_g1_ef980b8d8b1f3c3934a9", "source_dialogue_id": "esconv_0133", "source_turn_index": 20, "recent_visible_dialogue": [{"content": "okay i understand, and what do you suggest for when you do poorly on an exam that you studied so hard for, how do you keep yourself from feeling down?", "speaker": "seeker"}, {"content": "I would suggest talking to the professor or an academic advisor to explore strategies that could help you improve", "speaker": "supporter"}, {"content": "okay but is it normal to be upset?", "speaker": "seeker"}, {"content": "Of course, it is normal to feel upset. However, you should not blame yourself. No one is perfect.", "speaker": "supporter"}, {"content": "Okay that makes me feel better", "speaker": "seeker"}, {"content": "I am glad it does :D!", "speaker": "supporter"}], "supporter_response_to_label": "Anything else I can help you with today?"}]}, {"protocol": "pm-v1.5-strategy-g1-final-bank-human-review-v1", "card_id": "strategy_g1_ad962ba1b794ab038fd3", "move_id": "AM15_explore_interpersonal_boundary", "name": "Explore an interpersonal boundary", "support_move": "Help the user consider a specific limit or boundary without deciding the relationship for them or prescribing high-stakes action.", "when_to_use": "Use when the user raises a specific interpersonal limit and welcomes help clarifying what boundary would fit their goal.", "when_not_to_use": "Do not decide the relationship for the user, infer another person's motives, prescribe separation, or use ordinary boundary guidance in an abuse, violence, or other high-stakes situation.", "compatible_support_modes": ["explore", "light_guidance"], "compatible_dialogue_phases": ["exploration", "action"], "goal_types": ["clarify_boundary", "decide"], "directive_burden": "light", "risk_flags": ["values_imposition", "excessive_directiveness", "high_stakes_boundary"], "source_gate_status": "NARROW_EXCEPTION_REQUIRES_HUMAN_APPROVAL", "exception_rationale": "Narrow move with 11 independent clean weak-source dialogues, 4 problem types, 6 emotion types, and max single-problem share 0.5455. Count is below the standard 20-dialogue gate; approve only if the narrow definition and fixed source examples justify the exception.", "clean_weak_source_dialogues": 11, "problem_type_count_audit_only": 4, "emotion_type_count_audit_only": 6, "maximum_single_problem_type_share_audit_only": 0.5455, "eligible_for_g2": false, "raw_source_responses_exposed_to_generator": false, "source_examples": [{"blind_item_id": "strategy_g1_f3be6c193270ceada682", "source_dialogue_id": "esconv_1299", "source_turn_index": 13, "recent_visible_dialogue": [{"content": "That can be difficult and I can relate to that too. When friends do not respond the way that we feel that they should it can be really hard. Do you have any family that you are close with?", "speaker": "supporter"}, {"content": "They need more money from me, but i couldn't give that much amount", "speaker": "seeker"}, {"content": "I understand the issue of money can cause a lot of problems in a relationship. I had a best friend borrow money once and it lead to her never paying it back and we stopped being friends. Do you plan on trying to talk to your friends soon? Maybe I can give you some advice on how to approach them.", "speaker": "supporter"}, {"content": "I want to speak with them because they are in good nature", "speaker": "seeker"}, {"content": "Maybe you could chose a place to meet that is neutral, somewhere at a park or at a cafe. You can ask them to reflect on the good memories in your friendship and then express how you value them as people and friends. Does that sound like something you can try?", "speaker": "supporter"}, {"content": "Yes, i want to do some moderate friendship with them", "speaker": "seeker"}], "supporter_response_to_label": "That is a good idea too. Having boundaries is the healthiest part of a relationship so that neither party gets taken advantage of. Setting up lines not to cross is a great idea."}, {"blind_item_id": "strategy_g1_467005c09f2bb52c9df8", "source_dialogue_id": "esconv_0818", "source_turn_index": 12, "recent_visible_dialogue": [{"content": "Oh i see, well i think overthinking things like that can lead to unwanted emotions. Or putting yourself in a situation with another person when you are in a relationship might mean there are other issues going on.", "speaker": "supporter"}, {"content": "Yes i see that. No nothing else going on just thinking that the definition maybe shouldn't be as exact for the type of person that I do not talk to because of his reservations about it.", "speaker": "seeker"}, {"content": "Well, if you are not talking to them then i see no harm. If you are talking to them with some sort of intention to for a relationship beyond friendship then i see issues arising.", "speaker": "supporter"}, {"content": "That is what I feel. I am not talking to him. I had to the other day to get in contact with someone(medical emergency) but do not call just to chat and catch up. I even unfriended him. I just want to comfort him over it but I think it is best just to never speak of him again.", "speaker": "seeker"}, {"content": "Comfort my fiance", "speaker": "seeker"}, {"content": "To never speak to your fiance?", "speaker": "supporter"}], "supporter_response_to_label": "If you want to continue your relationship and you do not feel you can continue a platonic relationship with this other person then that might be best."}, {"blind_item_id": "strategy_g1_0c4835200bd7301ebf6f", "source_dialogue_id": "esconv_0663", "source_turn_index": 13, "recent_visible_dialogue": [{"content": "How did the lie hurt you?", "speaker": "supporter"}, {"content": "He say that lie i will hurt", "speaker": "seeker"}, {"content": "How long have you know him? Has he lied to you in the past?", "speaker": "supporter"}, {"content": "10 year friendship no one lie to the past", "speaker": "seeker"}, {"content": "That says a lot that he has never lied to you prior to this. What do you think changed about him to cause him to lie this time?", "speaker": "supporter"}, {"content": "He say sorry to me i accepted", "speaker": "seeker"}], "supporter_response_to_label": "Sometimes a little space can help resolve feelings. Do you feel that a little time would help you to be able to accept his apology and forgive him?"}, {"blind_item_id": "strategy_g1_f90f0fb77bc601ed559b", "source_dialogue_id": "esconv_0701", "source_turn_index": 12, "recent_visible_dialogue": [{"content": "Not really, we were talking recently and she just didn't really want to hear my opinion and talked over me. Normally she's pretty good at listening.", "speaker": "seeker"}, {"content": "Well, everyone, including yourself, is entitled to an off day. Maybe something is going on with her she doesnt want to share. Or possibly even she is trying to share but doesnt know how.", "speaker": "supporter"}, {"content": "I guess that could be the case.", "speaker": "seeker"}, {"content": "What should I do then?", "speaker": "seeker"}, {"content": "Perhaps try to reach out and see if anything is wrong.", "speaker": "supporter"}, {"content": "So I should just ask her if something is going on?", "speaker": "seeker"}], "supporter_response_to_label": "I would remember though, its ok for people to want to be left alone though if things are bad, sometimes they just need their space."}, {"blind_item_id": "strategy_g1_d28c8e14ff7478e041ef", "source_dialogue_id": "esconv_1169", "source_turn_index": 16, "recent_visible_dialogue": [{"content": "Well I thought it was good until that happened. He doesn't know. So I just feel gross around them.", "speaker": "seeker"}, {"content": "Have you talked to your friend about what she did?", "speaker": "supporter"}, {"content": "Yeah, she doesn't really care because she's not going to tell him. I'm questioning whether I should still be friends with her.", "speaker": "seeker"}, {"content": "You're definite right to be questioning if this is the sort of person you want to be friends with.", "speaker": "supporter"}, {"content": "It's hard to stop thought because we work at the same place.", "speaker": "seeker"}, {"content": "though..", "speaker": "seeker"}], "supporter_response_to_label": "If her behavior is getting to you like this, I definitely suggest you try to keep some distance from her as much as you can."}]}];

function radio(name,value){return `<label><input type="radio" name="${name}" value="${value}" onchange="progress()"> ${value}</label>`}
function checked(name){const x=document.querySelector(`input[name="${name}"]:checked`);return x?x.value:null}
function render(){const root=document.getElementById("cards");packet.forEach((row,i)=>{
 const d=document.createElement("section");d.className="card";
 let h=`<h2>${i+1}. ${row.move_id} — ${row.name}</h2>`;
 h+=`<div class="meta">source gate: ${row.source_gate_status}；clean dialogues=${row.clean_weak_source_dialogues}；problem types=${row.problem_type_count_audit_only}；emotion types=${row.emotion_type_count_audit_only}；max problem share=${row.maximum_single_problem_type_share_audit_only}</div>`;
 if(row.exception_rationale)h+=`<p class="warn"><b>Narrow exception:</b> ${row.exception_rationale}</p>`;
 h+=`<div class="box"><b>Move</b> ${row.support_move}\n<b>Use</b> ${row.when_to_use}\n<b>Do not</b> ${row.when_not_to_use}\n<b>Mode / phase / goal</b> ${row.compatible_support_modes.join(", ")} / ${row.compatible_dialogue_phases.join(", ")} / ${row.goal_types.join(", ")}\n<b>Burden / risk</b> ${row.directive_burden} / ${row.risk_flags.join(", ")}</div>`;
 fields.forEach(f=>h+=`<div><b>${f}</b> ${radio(`c_${i}_${f}`,"yes")} ${radio(`c_${i}_${f}`,"no")} ${radio(`c_${i}_${f}`,"uncertain")}</div>`);
 row.source_examples.forEach((ex,j)=>{const ctx=ex.recent_visible_dialogue.map(t=>`${t.speaker}: ${t.content}`).join("\n");
 h+=`<div class="example"><div class="meta">固定 literal source ${j+1} / dialogue=${ex.source_dialogue_id}</div><div class="box">${ctx}\n\nTARGET SUPPORTER RESPONSE:\n${ex.supporter_response_to_label}</div><div><b>move_fit</b> ${radio(`m_${i}_${j}`,"yes")} ${radio(`m_${i}_${j}`,"partial")} ${radio(`m_${i}_${j}`,"no")} ${radio(`m_${i}_${j}`,"uncertain")}</div><div><b>missed_hard_exclusion</b> ${radio(`x_${i}_${j}`,"yes")} ${radio(`x_${i}_${j}`,"no")} ${radio(`x_${i}_${j}`,"uncertain")}</div></div>`});
 h+=`<label>required_corrections / notes<textarea id="notes_${i}"></textarea></label>`;d.innerHTML=h;root.appendChild(d)});progress()}
function collect(){return packet.map((row,i)=>({protocol:manifest.protocol,card_id:row.card_id,move_id:row.move_id,...Object.fromEntries(fields.map(f=>[f,checked(`c_${i}_${f}`)])),source_example_review:row.source_examples.map((ex,j)=>({blind_item_id:ex.blind_item_id,move_fit:checked(`m_${i}_${j}`),missed_hard_exclusion:checked(`x_${i}_${j}`)})),required_corrections:document.getElementById(`notes_${i}`).value}))}
function progress(){const r=collect();const n=r.filter(x=>fields.every(f=>x[f]!==null)&&x.source_example_review.every(e=>e.move_fit!==null&&e.missed_hard_exclusion!==null)).length;document.getElementById("progress").textContent=`${n} / ${packet.length} cards complete`}
function downloadResults(){const text=collect().map(x=>JSON.stringify(x)).join("\n")+"\n";const b=new Blob([text],{type:"application/jsonl"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="pm_v1_5_strategy_g1_final_bank_human_annotations.jsonl";a.click();URL.revokeObjectURL(a.href)}
render();
</script></body></html>
