# Copy to experiment.yaml and edit only endpoint URLs/model names.
# API keys are read from environment variables and are never written to disk.
endpoints:
  synthetic_generator:
    base_url: "https://api.openai.com"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    family: "openai_gpt4o"
    timeout_seconds: 240

  # P2 uses a separately named endpoint because deterministic construction
  # control and ordinary natural-language surface generation are different
  # roles.  The model supplies safe surface variety only; a local compiler
  # enforces chronology and typed candidate structure.  It is not a response
  # judge and never reads H1/test outcomes.
  p2_data_generator:
    base_url: "https://api.openai.com"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    family: "openai_gpt4o"
    timeout_seconds: 240

  # Supporter generator: Llama-8B is mid-strength, more sensitive to evidence
  # than 70B models, and realistic for digital-human deployment.
  generator:
    base_url: "https://integrate.api.nvidia.com"
    model: "meta/llama-3.1-8b-instruct"
    api_key_env: "NVIDIA_API_KEY"
    family: "llama"
    timeout_seconds: 180

  # Seeker simulator: different family from generator (Mistral vs Llama)
  seeker:
    base_url: "https://integrate.api.nvidia.com"
    model: "mistralai/mixtral-8x7b-instruct-v0.1"
    api_key_env: "NVIDIA_API_KEY"
    family: "mistral"
    timeout_seconds: 180

  # Alternative seeker for robustness runs
  seeker_alt:
    base_url: "https://integrate.api.nvidia.com"
    model: "qwen/qwen2_5-7b-instruct"
    api_key_env: "NVIDIA_API_KEY"
    family: "qwen"
    timeout_seconds: 180

  # Training judge: Gemini Flash-Lite is the low-cost development labeler once
  # it passes the frozen V3 pilot gate. Final/confirmatory judging must use a
  # different model family.
  training_judge:
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    model: "gemini-2.5-flash-lite"
    api_key_env: "GEMINI_API_KEY"
    family: "google_gemini"
    transport: "gemini_generate_content"
    timeout_seconds: 180

  # Cheap fallback for quick schema smoke tests only; it is not currently
  # accepted for full judging because it failed the pilot gate.
  training_judge_openai_mini:
    base_url: "https://api.openai.com"
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    family: "openai_gpt4o"
    timeout_seconds: 180

  # Low-cost NVIDIA-hosted judge candidates for full development labeling.
  # They must pass the V3.2/V3.3 judge pilot gate before use in full judging.
  training_judge_deepseek_flash:
    base_url: "https://integrate.api.nvidia.com"
    model: "deepseek-ai/deepseek-v4-flash"
    api_key_env: "NVIDIA_API_KEY"
    family: "deepseek"
    timeout_seconds: 240

  # DeepSeek's own official API (not NVIDIA-hosted): added after three
  # consecutive real crashes on training_judge_deepseek_flash, all HTTP 429/
  # 503 from the NVIDIA free/prototyping tier (confirmed hard-capped at 40
  # RPM via the account dashboard). DeepSeek's own docs state they do not
  # enforce an RPM quota and slow down under load rather than reject.
  # Deliberately a distinct endpoint/family, not a silent replacement of
  # training_judge_deepseek_flash -- nothing references this yet; no existing
  # stage's judge_endpoints, pricing, or contract hash changes until a stage
  # is explicitly repointed at it.
  training_judge_deepseek_official_flash:
    base_url: "https://api.deepseek.com"
    model: "deepseek-v4-flash"
    api_key_env: "DEEPSEEK_API_KEY"
    family: "deepseek_official"
    timeout_seconds: 240
    # Confirmed via a real HTTP 400 ("This response_format type is
    # unavailable now") and DeepSeek's own docs (api-docs.deepseek.com/
    # guides/json_mode): the official API only supports the older, loose
    # json_object response_format, not OpenAI's newer strict json_schema
    # mode that NVIDIA's gateway happily forwards for the same model.
    supports_strict_json_schema: false
    # deepseek-v4-flash defaults to thinking enabled (api-docs.deepseek.com/
    # guides/thinking_mode/); three real judge calls exhausted their entire
    # max_tokens budget on unrequested reasoning before any JSON content,
    # landing on completion_tokens == the configured ceiling every time and
    # leaving empty/truncated content. Judging is fixed-rubric scoring, not a
    # task that needs long chain-of-thought, so thinking is disabled here.
    thinking_mode: disabled

  # Returns a real HTTP 410. Verified via GET /v1/models on NVIDIA's gateway
  # (2026-07-28): this model is not listed and no Qwen model currently is --
  # not a schema-mode issue (disabling strict mode did not change the
  # result). No direct substitute is currently available on this gateway.
  training_judge_qwen122:
    base_url: "https://integrate.api.nvidia.com"
    model: "qwen/qwen3.5-122b-a10b"
    api_key_env: "NVIDIA_API_KEY"
    family: "qwen"
    timeout_seconds: 240

  # z-ai/glm-5.1 returned a real HTTP 410 on NVIDIA's model catalog (verified
  # via GET /v1/models: not listed, not a schema-mode issue). z-ai/glm-5.2 is
  # its listed successor on the same gateway.
  training_judge_glm51:
    base_url: "https://integrate.api.nvidia.com"
    model: "z-ai/glm-5.2"
    api_key_env: "NVIDIA_API_KEY"
    family: "glm"
    timeout_seconds: 180

  # Low-cost Google judge candidates. They are independent from the Llama
  # generator, Mistral seeker, and NVIDIA-hosted judge candidates. Use only
  # after they pass the same V3 pilot gate as any other training judge.
  training_judge_gemini_flash_lite:
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    model: "gemini-2.5-flash-lite"
    api_key_env: "GEMINI_API_KEY"
    family: "google_gemini"
    transport: "gemini_generate_content"
    timeout_seconds: 180

  training_judge_gemini_flash:
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    model: "gemini-2.5-flash"
    api_key_env: "GEMINI_API_KEY"
    family: "google_gemini"
    transport: "gemini_generate_content"
    timeout_seconds: 180
    # Unlike flash-lite, gemini-2.5-flash defaults to thinking enabled, and
    # hidden thought tokens count against maxOutputTokens. Confirmed via a
    # real judge call: an unrequested chain-of-thought consumed the output
    # budget before any JSON content, producing a truncated/unterminated
    # JSON body. thinkingBudget=0 disables thinking for this model.
    gemini_thinking_budget: 0

  # Final/confirmatory judge: OpenAI family is independent from the default
  # Gemini training judge. Do not select a final judge from the same family as
  # the full-judging training endpoint.
  final_judge:
    base_url: "https://api.openai.com"
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    family: "openai_gpt4o"
    timeout_seconds: 240

  # Optional Claude final judge fallback if Gemini quota is too tight.
  # Do not use this as final_judge when training_judge is also Claude.
  # Uses AnthropicClient in api.py (not OpenAI-compatible format).
  final_judge_claude:
    base_url: "https://api.anthropic.com"
    model: "claude-sonnet-4-6"
    api_key_env: "ANTHROPIC_API_KEY"
    family: "anthropic_claude"
    timeout_seconds: 240

  # Low-cost Claude judge candidate, evaluated after gemini-2.5-flash failed
  # the E6-response pilot gate (pm-v1.5-v5.2-external-e6-gemini-pilot-v1,
  # FAIL on ab_ba_consistency/quality_agreement/risk_agreement). Independent
  # family from final_judge (openai_gpt4o) used as its calibration anchor.
  # Same model already exercised in role_decomposed_judge_qualification_v1
  # (candidate_key=anthropic_claude_haiku_4_5, 48/48 quality + 48/48 risk
  # schema completion there).
  training_judge_claude_haiku:
    base_url: "https://api.anthropic.com"
    model: "claude-haiku-4-5-20251001"
    api_key_env: "ANTHROPIC_API_KEY"
    family: "anthropic_claude"
    timeout_seconds: 180

protocol:
  generator_temperature: 0.0
  response_noninferiority_margin: 0.05
  misuse_noninferiority_margin: 0.05
  minimum_cost_reduction: 0.10
  primary_seed: 101
  robustness_seeds: [101, 202, 303]
  synthetic_variant_mode: "balanced9"
  strategy_top_k: 3
  evoemo_session_rag_top_k: 4
  confirmatory_seeker_endpoints: ["seeker", "seeker_alt"]
