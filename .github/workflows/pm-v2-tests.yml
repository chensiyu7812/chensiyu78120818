name: PM tests

on:
  pull_request:
    paths:
      - "project/**"
      - ".github/workflows/pm-v2-tests.yml"
  push:
    branches:
      - main
      - "codex/**"
      - "agent/**"
      - "pm-v1.5-*"
    paths:
      - "project/**"
      - ".github/workflows/pm-v2-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep dependency resolution isolated from runner-level user packages.
      # Reportable PM-v1.5 stages enforce the same invariant at runtime.
      PYTHONNOUSERSITE: "1"
    defaults:
      run:
        working-directory: project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: project/pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile PM-v2 modules
        run: python -m compileall -q src scripts tests
      - name: Run blocking V5.3 clean-release suite
        run: pytest -q tests/test_v1_5_v5_3_*.py
      - name: Run complete historical suite (diagnostic)
        continue-on-error: true
        run: pytest -q
