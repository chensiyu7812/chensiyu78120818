name: PM-v2 / PM-v1.6 tests

on:
  pull_request:
    paths:
      - "project/src/metacom_pm/**"
      - "project/scripts/**"
      - "project/tests/**"
      - "project/configs/**"
      - "project/pyproject.toml"
      - "README_PM_V1_5_REVIEW_ZH.md"
      - "README_PM_V1_6_REVIEW_ZH.md"
      - "project/docs/PM_V1_6_*"
      - ".github/workflows/pm-v2-tests.yml"
  push:
    branches:
      - main
    paths:
      - "project/src/metacom_pm/**"
      - "project/scripts/**"
      - "project/tests/**"
      - "project/configs/**"
      - "project/pyproject.toml"
      - "README_PM_V1_5_REVIEW_ZH.md"
      - "README_PM_V1_6_REVIEW_ZH.md"
      - "project/docs/PM_V1_6_*"
      - ".github/workflows/pm-v2-tests.yml"

concurrency:
  group: pm-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: project
    env:
      PYTHONPATH: ${{ github.workspace }}/project:${{ github.workspace }}/project/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: project/pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile all modules
        run: python -m compileall -q src scripts tests
      - name: Validate PM-v1.6 method contract
        run: python scripts/v1_6/00_validate_method_contract.py
      - name: Collect private-artifact integration tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest --collect-only -q -m requires_private_artifacts 2>&1 | tee private_artifact_tests.log
      - name: Run clean-checkout unit and contract suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -m "not requires_private_artifacts" 2>&1 | tee pytest.log
      - name: Upload pytest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ github.run_id }}
          path: |
            project/pytest.log
            project/private_artifact_tests.log
          if-no-files-found: warn
          retention-days: 7
