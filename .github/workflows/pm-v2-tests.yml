name: PM-v2 / PM-v1.6 tests

on:
  pull_request:
    paths:
      - "project/src/metacom_pm/**"
      - "project/scripts/**"
      - "project/tests/**"
      - "project/configs/**"
      - "project/pyproject.toml"
      - "README_PM_V1_5_REVIEW_ZH.md"
      - "README_PM_V1_6_REVIEW_ZH.md"
      - "project/docs/PM_V1_6_*"
      - ".github/workflows/pm-v2-tests.yml"
  push:
    branches:
      - main
      - codex/pm-v2-hardening
      - agent/pm-v1-5-conference-review
    paths:
      - "project/src/metacom_pm/**"
      - "project/scripts/**"
      - "project/tests/**"
      - "project/configs/**"
      - "project/pyproject.toml"
      - "README_PM_V1_5_REVIEW_ZH.md"
      - "README_PM_V1_6_REVIEW_ZH.md"
      - "project/docs/PM_V1_6_*"
      - ".github/workflows/pm-v2-tests.yml"

concurrency:
  group: pm-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: project
    env:
      PYTHONPATH: ${{ github.workspace }}/project:${{ github.workspace }}/project/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: project/pyproject.toml
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Compile all modules
        run: python -m compileall -q src scripts tests
      - name: Validate PM-v1.6 method contract
        run: python scripts/v1_6/00_validate_method_contract.py
      - name: Run complete test suite
        run: python -m pytest -q
